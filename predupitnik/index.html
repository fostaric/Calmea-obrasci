.other{margin-top:6px}
.files .f{font-size:14px;padding:4px 0}

.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.5}

.item .q{padding:6px 0;border:0}
.item .pair{border:0}

.err{border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin:10px 0;background:var(--card)}

.priv input{width:22px;height:22px;flex:none;margin-top:2px}
.hidden{display:none!important}

#toast.on{opacity:.92}
#print{display:none}

  #print tr{break-inside:avoid}
  #print .foot{font-size:8pt;color:#555;margin-top:12px}
}
</style>

async function rpc(fn, body){
  const r = await fetch(`${D.url}/rest/v1/rpc/${fn}`, {method:"POST", headers:{"apikey":D.key, "Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j && j.message) || ("Greška " + r.status));
  return j;
}

function save(){ try{ cur.izmijenjeno = new Date().toISOString(); localStorage.setItem(SKEY, JSON.stringify(cur)); }catch(e){} }

const vals = k => String(cur.odgovori[k] || "").split(",").map(x => x.trim()).filter(Boolean);
function ok(a){
  if(!a) return true;
  const [k, op, v] = a, val = String(cur.odgovori[k] || "").trim();
  if(op === "ima") return [].concat(v).some(x => vals(k).some(y => y.startsWith(x)));
  if(op === "je") return val === v;
  if(op === "nije") return !v.includes(val);
  return true;
}

  }
  else if(it.t==="file") fileField(it, obj, w, set);
  if(it.ex && ["txt","num","long"].includes(it.t)) { const e=document.createElement("div"); e.className="ex"; e.textContent="npr. "+it.ex; w.append(e); }
  if(it.nap) { const e=document.createElement("div"); e.className="nap"; e.textContent=it.nap; w.append(e); }
  return w;
}

// ---------- prilozi (Supabase Storage, bucket 'dokumenti', mapa = kod pozivnice)
function fileField(it, obj, w, set){
  const list = document.createElement("div"); list.className = "files";
  const names = () => String(obj[it.k] || "").split(";").map(x=>x.trim()).filter(Boolean);
  const draw = () => { list.innerHTML = names().map(n => `<div class="f">📎 ${esc(n.replace(/^\d+_/, ""))} ✔</div>`).join(""); };
  const inp = document.createElement("input"); inp.type = "file"; inp.multiple = true; inp.accept = ".pdf,image/*"; inp.className = "hidden";
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "btn sec"; btn.style.width = "100%"; btn.textContent = "+ Priloži datoteku";
  btn.onclick = () => inp.click();
  inp.onchange = async () => {
    for(const f of inp.files){
      if(f.size > MAX_MB*1024*1024){ toast(`${f.name}: veće od ${MAX_MB} MB`); continue; }
      btn.disabled = true; btn.textContent = "Šaljem " + f.name + "…";
      try{ const n = await upload(f); set(names().concat(n).join("; ")); draw(); toast("Priloženo ✔"); }
      catch(e){ toast("Prilog nije poslan: " + e.message); }
    }
    btn.disabled = false; btn.textContent = "+ Priloži datoteku"; inp.value = "";
  };
  draw(); w.append(list, btn, inp);
  const e = document.createElement("div"); e.className = "ex"; e.textContent = `PDF ili fotografija, najviše ${MAX_MB} MB. Šalje se odmah (treba internet).`; w.append(e);
}
async function upload(file){
  const safe = file.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").slice(-80);
  const name = `${Date.now()}_${safe}`;
  const r = await fetch(`${D.url}/storage/v1/object/dokumenti/${encodeURIComponent(KOD)}/${name}`,
    {method:"POST", headers:{"apikey":D.key, "Content-Type": file.type || "application/octet-stream", "x-upsert":"false"}, body:file});
  if(!r.ok){ const j = await r.json().catch(()=>null); throw new Error((j && (j.message || j.error)) || ("Greška " + r.status)); }
  return name;
}

function listCard(title, uvod, open){
  const c = card(title, b => {
    const u=document.createElement("div"); u.className="uvod"; u.textContent=uvod; b.append(u);
    const wrap=document.createElement("div"); b.append(wrap);
    const P_ = D.proizvod_polja.map(([k,q,t,o]) => ({k,q,t,o,ex:""}));
    const draw=()=>{ wrap.innerHTML=""; cur.proizvodi.forEach((obj,i)=>{ const it=document.createElement("div"); it.className="item";
        const hd=document.createElement("div"); hd.className="hd"; hd.innerHTML=`<span>${i+1}. ${esc(obj.naziv||"")}</span>`;
        const x=document.createElement("button"); x.className="btn warn"; x.style.padding="6px 10px"; x.textContent="✕";
        x.onclick=()=>{ if(confirm("Ukloniti proizvod?")){ cur.proizvodi.splice(i,1); save(); draw(); cnt(); } }; hd.append(x); it.append(hd);
        const on = () => { hd.firstChild.textContent=`${i+1}. ${obj.naziv||""}`; cnt(); };
        P_.forEach(p => { if(p.k==="kolicina_kg") return;
          if(p.k==="kolicina_kom"){ const pr=document.createElement("div"); pr.className="pair"; pr.append(field(p,obj,on), field(P_.find(z=>z.k==="kolicina_kg"),obj,on)); it.append(pr); }
          else it.append(field(p, obj, on)); });
        wrap.append(it); }); };
    const add=document.createElement("button"); add.className="btn sec"; add.style.width="100%"; add.textContent="+ Dodaj proizvod";
    add.onclick=()=>{ cur.proizvodi.push({}); save(); draw(); cnt(); wrap.lastChild && wrap.lastChild.scrollIntoView({behavior:"smooth"}); };
    b.append(add); draw();
  }, open);
  const cnt=()=>{ c.querySelector(".cnt").textContent = cur.proizvodi.length; }; cnt(); return c;
}
function sendCard(){
  const c = document.createElement("section"); c.className="card pad"; c.id="cSend";
  c.innerHTML = `<h1 style="font-size:17px">Slanje</h1>
    <label class="priv"><input type="checkbox" id="priv"><span>Pristajem da <b>Calmea</b> (obrt za usluge, proizvodnju i trgovinu) obrađuje podatke iz ovog upitnika i priložene dokumente <b>isključivo radi izrade ili revizije HACCP sustava</b> mog objekta i pripreme obilaska. Podaci se čuvaju u EU (Frankfurt), ne daju se trećima i mogu zatražiti njihovo brisanje na calmea.croatia@gmail.com.</span></label>
    <button class="btn" id="bSend2" style="width:100%">Pošalji Calmei</button>
    <div id="sRes"></div>`;
  setTimeout(()=>{ $("#priv").checked = !!cur.privola; $("#priv").onchange = e => { cur.privola = e.target.checked; save(); }; $("#bSend2").onclick = posalji; });
  return c;
}
// samo odgovori iz vidljivih pitanja (skrivene grane se ne šalju)
function odgovoriZaSlanje(){
  const out = {OBJEKT_NAZIV: cur.odgovori.OBJEKT_NAZIV || P.sirana};
  vidljive().forEach(s => s.items.filter(it => ok(it.ako)).forEach(it => [it, it.par].filter(Boolean).forEach(x => {
    const v = cur.odgovori[x.k]; if(String(v ?? "").trim()) out[x.k] = v; })));
  if(String(out.OBJEKT_STATUS || "").startsWith("Odobrena – mali kapacitet")) out.MALI_KAPACITET = "DA";
  return out;
}
const proizvodiZaSlanje = () => cur.proizvodi.filter(p => Object.values(p).some(v => String(v||"").trim()))
  .map(p => Object.assign({}, p, {kolicina: [p.kolicina_kom && p.kolicina_kom + " kom", p.kolicina_kg && p.kolicina_kg + " kg"].filter(Boolean).join(" / ")}));
async function posalji(){
  if(!$("#priv").checked){ $("#cSend").scrollIntoView({behavior:"smooth"}); toast("Za slanje označite privolu."); return; }
  const btns = [$("#bSend"), $("#bSend2")]; btns.forEach(b=>b.disabled=true);
  const podaci = {format:"calmea-upitnik", izvor:"klijent", sirana:P.sirana, vrsta:P.vrsta, odgovori:odgovoriZaSlanje(),
                  proizvodi:proizvodiZaSlanje(), dobavljaci:[], rizik:[null,null,null,null,null,null,null],
                  verzija_obrasca:D.verzija, poslano:new Date().toISOString()};
  try{
    await rpc("posalji_upitnik", {p_kod:KOD, p_podaci:podaci, p_privola:true, p_verzija:D.verzija});
    cur.poslano = podaci.poslano; save();
    $("#sRes").innerHTML = `<div class="ok"><b>Hvala! Upitnik je poslan.</b><br>Javit ćemo vam se radi dogovora obilaska. Ako nešto dopunite, kliknite ponovno Pošalji.</div>`;
    toast("Poslano ✔");
  }catch(e){
    $("#sRes").innerHTML = `<div class="err">Slanje nije uspjelo: ${esc(e.message)}<br>Odgovori su spremljeni na uređaju — pokušajte ponovno ili spremite PDF kopiju i pošaljite je mailom.</div>`;
  }finally{ btns.forEach(b=>b.disabled=false); $("#sRes").scrollIntoView({behavior:"smooth"}); }
}
$("#bSend").onclick = () => { $("#cSend").scrollIntoView({behavior:"smooth"}); if($("#priv").checked) posalji(); else toast("Označite privolu pa pošaljite."); };

$("#bPdf").onclick = () => {
  const odg = odgovoriZaSlanje();
  let h = `<h1>Upitnik prije obilaska — HACCP</h1><div class="sub">${esc(P.sirana)} · ${new Date().toLocaleDateString("hr-HR")} · Calmea · HACCP + oznake kvalitete</div>`;
  vidljive().forEach(s => {
    if(s.t==="@PROIZVODI"){ const pr = proizvodiZaSlanje(); if(!pr.length) return;
      const cols = D.proizvod_polja.filter(p => !p[0].startsWith("kolicina_") && pr.some(o => String(o[p[0]]||"").trim()));
      if(pr.some(o => o.kolicina)) cols.splice(cols.length - (cols.some(p=>p[0]==="napomena") ? 1 : 0), 0, ["kolicina", "Tjedno"]);
      h += `<h2>Proizvodi</h2><table><tr>${cols.map(p=>`<th>${esc(p[1])}</th>`).join("")}</tr>` + pr.map(o=>"<tr>"+cols.map(p=>`<td>${esc(o[p[0]]||"")}</td>`).join("")+"</tr>").join("") + "</table>"; return; }
    const rows = []; s.items.filter(it => ok(it.ako)).forEach(it => [it, it.par].filter(Boolean).forEach(x => { if(odg[x.k]) rows.push(x); }));
    if(!rows.length) return;
    h += `<h2>${esc(s.t)}</h2><table>` + rows.map(it=>`<tr><td class="q">${esc(it.q)}</td><td>${esc(it.t==="file" ? String(odg[it.k]).replace(/(^|; )\d+_/g,"$1") : odg[it.k]).replace(/\n/g,"<br>")}</td></tr>`).join("") + "</table>";
  });
  h += `<div class="foot">${cur.poslano ? "Poslano Calmei " + new Date(cur.poslano).toLocaleString("hr-HR") + ". " : ""}Podaci se koriste isključivo za izradu i reviziju HACCP sustava. Calmea · calmea.croatia@gmail.com · +385 91 124 6981</div>`;
  $("#print").innerHTML = h; const t = document.title; document.title = "Upitnik_" + P.sirana.replace(/[^\p{L}\p{N}]+/gu,"_"); window.print(); setTimeout(()=>document.title=t, 1500);
};
start();
</script>
